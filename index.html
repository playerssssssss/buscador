<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://w3.org" xml:lang="es" lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Buscador Global Estricto</title>
    <link rel="stylesheet" type="text/css" href="estilos.css" />
    <script type="text/javascript" src="buscador.js"></script>
</head>
<body>

<div id="contenedor">
    <h1>Buscador de Internet Global</h1>

    <form action="#" id="formulario-busqueda">
        <fieldset>
            <legend>Buscar en la red indexada</legend>
            <p>
                <label for="termino">Término de búsqueda:</label>
                <input type="text" id="termino" name="termino" />
                <input type="submit" id="boton-buscar" value="Buscar" />
            </p>
        </fieldset>
    </form>

    <h2>Resultados globales de la base de datos</h2>
    <div id="resultados">
        <p>Introduce cualquier palabra para buscar en las páginas indexadas por el crawler.</p>
    </div>
</div>

</body>
</html>
