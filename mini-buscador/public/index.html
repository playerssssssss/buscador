<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Buscador (Perl + JS + JSON)</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --text: #e8e8e8;
      --accent: #ff6b35;
      --link: #4cc9f0;
      --muted: #888;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    h1 {
      color: var(--accent);
      margin: 0 0 6px 0;
      font-size: 2rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input[type="search"] {
      flex: 1;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 10px;
      background: var(--card);
      color: #fff;
    }
    input[type="search"]:focus {
      outline: none;
      border-color: var(--link);
    }
    button {
      padding: 14px 22px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #e55a2b; }
    .stats {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
    }
    .result {
      margin-bottom: 26px;
      padding-bottom: 20px;
      border-bottom: 1px solid #222;
    }
    .result a.title {
      color: var(--link);
      font-size: 1.2rem;
      text-decoration: none;
      font-weight: 500;
    }
    .result a.title:hover { text-decoration: underline; }
    .result .url {
      color: #6a9955;
      font-size: 13px;
      margin: 4px 0 6px;
      word-break: break-all;
    }
    .result .snippet {
      color: #bbb;
      font-size: 14px;
    }
    .result .snippet mark {
      background: transparent;
      color: var(--accent);
      font-weight: 700;
    }
    .empty {
      color: var(--muted);
      font-style: italic;
    }
    .loading {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mini Buscador</h1>
    <p class="subtitle">Crawler en Perl · Índice JSON · Búsqueda en JavaScript</p>

    <form id="search-form">
      <input type="search" id="q" placeholder="Escribe lo que quieres buscar..." autofocus autocomplete="off">
      <button type="submit">Buscar</button>
    </form>

    <div class="stats" id="stats">Cargando índice...</div>
    <div id="results"></div>
  </div>

  <script src="search.js"></script>
</body>
</html>
